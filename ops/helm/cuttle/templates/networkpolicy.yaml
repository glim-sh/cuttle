apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cuttle.fullname" . }}-deny-ingress
  labels:
    {{- include "cuttle.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cuttle.selectorLabels" . | nindent 6 }}
  # Deny all ingress: CDP is unauthenticated, and `kubectl port-forward` reaches
  # the pod directly (it does not traverse the Service network path), so no
  # in-cluster ingress is needed. Egress stays open (Chrome must reach the web).
  # Remote mode admits remote.ingressFrom to the remote port and nothing else; the
  # listener authenticates every request anyway, this is the second wall - and
  # with remote.trustNetworkPeers the first, since a peer outside the pod needs
  # no credential for the viewer and CDP.
  policyTypes:
    - Ingress
  {{- if and .Values.remote.enabled .Values.remote.ingressFrom }}
  ingress:
    - from:
        {{- toYaml .Values.remote.ingressFrom | nindent 8 }}
      ports:
        - port: {{ .Values.remote.port }}
          protocol: TCP
  {{- else }}
  ingress: []
  {{- end }}
