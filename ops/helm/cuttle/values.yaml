# cuttle Helm chart values. The CLI (`cuttle up` with a k8s context) shells
# `helm upgrade --install` against this chart and sets image.tag/proxy/etc from
# the context config; these are the defaults for a manual `helm install`.

image:
  repository: ghcr.io/glim-sh/cuttle
  # Bumped by release-please (see extra-files in .github/release-please-config.json)
  # so the chart default never skews from the released daemon. `cuttle up`
  # overrides it only when --image is passed.
  tag: "0.13.0" # x-release-please-version
  pullPolicy: IfNotPresent

# One browser per release. CDP is single-writer; do not scale this up.
replicaCount: 1

# profileStorage selects the profile backing store:
#   remote - a durable PVC (RWO) with --keep-profile: the full Chrome profile
#            (cookies, localStorage, IndexedDB, service workers) survives pod
#            recreation. `cuttle up` opts into this BY DEFAULT so the default
#            session persists like the docker backends' named volume; `cuttle down
#            --purge` / `--purge-profile` delete the PVC.
#   local  - ephemeral emptyDir scratch. Per-seed Chrome profile dirs are
#            disposable; auth state is captured over CDP - the daemon supervises
#            checkpoints and re-injects them at launch. `cuttle up --ephemeral`
#            selects this. Nothing durably persists in the pod.
# Default ON (remote), matching the docker backends' persist-by-default and the
# cuttle CLI (which sets remote unless --ephemeral). Uses the cluster default
# StorageClass unless persistence.storageClass below is set.
profileStorage: remote

# Where the per-seed Chrome user_data_dirs live inside the container. The scratch
# volume (emptyDir or PVC) mounts here.
dataDir: /data

# Default proxy applied to every seed at browser startup (CUTTLE_PROXY).
# geoip (tz/locale/exit-IP) auto-follows it. Empty = no default proxy.
proxy: ""

# Seconds of no CDP client activity after which an idle per-seed browser is
# closed (CUTTLE_IDLE_TIMEOUT). Empty (or "0") = off, browsers stay warm. Set by
# `cuttle up --idle-timeout` for a k8s context.
idleTimeout: ""

# Screen size the browser claims and is sized to, "WxH" from the image persona's
# table (CUTTLE_SCREEN; `cuttle serve --help` lists the choices for the arch).
# Empty = the daemon default: the persona's largest in session mode, one per seed
# in pool mode. Set by `cuttle up --screen` or a context's `screen` for a k8s
# context.
screen: ""

# Rewrite CDP Input events into human-like mouse/keyboard/scroll so interactions
# defeat behavioral detection (the daemon defaults this on). false sets
# CUTTLE_HUMANIZE=0 to disable it. Set by `cuttle up --humanize=false`.
humanize: true

# Let drivers call Target.createBrowserContext instead of having it rejected.
# Off by default: one identity per seed. Turn it on for a stack whose
# browser.newContext() is not optional; the created context still inherits the
# seed's fingerprint and proxy. Sets CUTTLE_ALLOW_CONTEXT_CREATION=1.
# Set by `cuttle up --allow-context-creation`.
allowContextCreation: false

# Production runs the amd64/Windows-persona build, so a hard kubernetes.io/arch=
# amd64 selector is always merged in - never schedule on arm (the arm64 image is
# the local macOS-persona build, not for k8s). Extra selectors here are additive
# (e.g. a dedicated browser node pool).
nodeSelector: {}

tolerations: []

resources:
  requests:
    memory: 1Gi
    cpu: 500m
  limits:
    memory: 4Gi

# PVC settings, used only when profileStorage=remote.
persistence:
  size: 5Gi
  # Leave null to use the cluster default StorageClass.
  storageClass: ""

# CUTTLE_VNC=1 makes the KasmVNC web viewer on 6080 live for login handoff.
vnc: true

# Liveness (/healthz) and readiness (/readyz) probes on the CDP port. Neither
# touches Chrome. See the deployment template for what each checks.
probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 15
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3

# Prometheus scrape annotations for /metrics on the CDP port. Off by default:
# turn on when a Prometheus in the cluster discovers pods by annotation.
metrics:
  podAnnotations: false
