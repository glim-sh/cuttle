pre-commit:
  piped: true
  commands:
    fmt:
      glob: "*.go"
      run: gofumpt -w {staged_files}
      stage_fixed: true
    # ./... rather than {staged_files}: golangci-lint refuses an explicit file
    # list spanning more than one directory ("named files must all be in one
    # directory"), so any commit touching two packages failed the hook. The whole
    # repo lints in under a second.
    lint:
      glob: "*.go"
      run: golangci-lint run --fix ./...
      stage_fixed: true
    mod-tidy:
      glob: "*.{go,mod,sum}"
      run: go mod tidy
    secrets:
      run: gitleaks git --pre-commit --staged --redact=100 --no-banner
    # Workflow YAML is only exercised by pushing it, so a typo in an expression
    # or a shell block is found by a failed run on main. actionlint shellchecks
    # every `run:` block too, which is where this repo's workflow logic lives.
    actions:
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}

pre-push:
  commands:
    test:
      run: go test -race ./...
