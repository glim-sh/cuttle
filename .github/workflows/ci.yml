name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; the release jobs elevate for their own publishing.
permissions:
  contents: read

# Concurrency is per-job, not workflow-level: a build stays cancellable, but the
# release job must never be cancelled mid-publish.

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v4

      # go.mod/go.sum must already be tidy - lefthook's mod-tidy hook only fires
      # on staged module files, so a drift can slip in from an unrelated commit.
      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

      - name: Test
        run: |
          go install gotest.tools/gotestsum@v1.13.0
          gotestsum --format github-actions -- -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Vuln
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      # Both halves of a version-bearing file, either of which silently does
      # nothing without the other. See the script for the two releases this
      # would have caught.
      - name: Version files
        run: ./ops/scripts/check-version-files.sh

      # helm is preinstalled on ubuntu-latest; guard the chart against drift.
      - name: Helm lint
        run: |
          helm lint ops/helm/cuttle
          helm template ops/helm/cuttle >/dev/null

      # Build the amd64 image and smoke it over raw CDP (per-seed isolation,
      # stealth coherence, WebGL via ANGLE). This one stays a local build because
      # the smoke run needs the image `load`ed into the runner's docker, which the
      # reusable builder cannot do. buildx GHA cache reuses the apt + browser +
      # KasmVNC layers so only a Chrome bump re-downloads them.
      - name: Build image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ops/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: cuttle:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Smoke (Go harness over CDP)
        run: |
          set -euo pipefail
          docker run -d --name cuttle-smoke -p 127.0.0.1:19222:9222 --shm-size=2g cuttle:ci cuttle serve --headless=false --mode=pool
          # Pool mode refuses an unseeded /json/version, so probe the daemon's
          # liveness endpoint, which costs no browser.
          ready=
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:19222/healthz >/dev/null 2>&1 && { ready=1; break; }
            sleep 1
          done
          # Without this the harness runs anyway and reports four connection-refused
          # failures, which reads as a stealth regression. A daemon that panicked on
          # startup says so in its own log - print it and stop here.
          if [ -z "$ready" ]; then
            echo "::error::cuttle never answered on :19222 - container log follows"
            docker logs cuttle-smoke 2>&1 | tail -100
            exit 1
          fi
          CUTTLE_URL=http://127.0.0.1:19222 go run ./test/smoke

      - name: Teardown
        if: always()
        run: docker rm -f cuttle-smoke >/dev/null 2>&1 || true

  # The arm64 image is a DIFFERENT persona (macOS: its own font pack, system-ui
  # pin and GPU pin), and release pushes it - so amd64-only CI shipped it with no
  # validation at all. Docker's reusable builder runs it on a native
  # ubuntu-24.04-arm runner, which is why this is a build and not a QEMU step: the
  # emulated build worked, but emulated Chrome aborts ("qemu: uncaught target
  # signal 6"), so nothing could be asserted on a running browser anyway. The
  # build still catches what actually breaks per-arch - a missing package, a
  # failed font-pack stage, a checksum mismatch on the arm64 browser tarball.
  # Behavioural arm64 validation is native on Apple Silicon (packages/browser/README.md).
  image-arm64:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read # fetch the repository content
      id-token: write # sign the GHA cache entries this build writes
    concurrency:
      group: image-arm64-${{ github.ref }}
      cancel-in-progress: true
    with:
      output: image
      push: false # build-only; nothing reaches GHCR outside a release
      platforms: linux/arm64
      file: ops/docker/Dockerfile
      meta-images: ghcr.io/glim-sh/cuttle
      cache: true
      cache-mode: max
      # Same scope as the release build, which the builder suffixes per platform -
      # so a release reuses the arm64 layers this job just warmed.
      cache-scope: cuttle

  # Runs only on push to main, and only after both image arches are green.
  # release-please maintains the release PR; merging it cuts the tag + GitHub
  # release, and the gated steps then publish GoReleaser binaries + the Homebrew
  # cask in this same run - no PAT-triggered tag handoff.
  release:
    needs: [build-and-test, image-arm64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag + release, GoReleaser upload
      pull-requests: write # release-please PR
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      release_pr: ${{ steps.rp.outputs.pr }}
      version: ${{ steps.rp.outputs.version }}
      major: ${{ steps.rp.outputs.major }}
      minor: ${{ steps.rp.outputs.minor }}
    steps:
      # release-please-action is API-driven and needs no checkout.
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          # A PAT authors the release PR as a real user so its CI runs without the
          # github-actions[bot] approval gate; falls back to GITHUB_TOKEN if the
          # secret is absent (the PR still opens, but its checks need manual approval).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      # Everything below runs only when merging the release PR actually cut a
      # release (release_created == true).
      - uses: actions/checkout@v7
        if: steps.rp.outputs.release_created == 'true'
        with:
          fetch-depth: 0 # GoReleaser needs full history + the new tag

      - uses: actions/setup-go@v7
        if: steps.rp.outputs.release_created == 'true'
        with:
          go-version-file: go.mod

      # release-please runs with skip-changelog, so the release it just opened
      # has no body yet; git-cliff renders the same entry it writes to
      # CHANGELOG.md. GoReleaser is `mode: append` with `changelog.disable`, so
      # it adds artifacts below this without touching it.
      - name: Release body
        if: steps.rp.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: |
          ./ops/scripts/install-git-cliff.sh
          # --latest, not --current: --current renders only when HEAD is itself
          # the tagged commit, and would silently produce an empty body the first
          # time that stopped being true.
          git-cliff --config .github/cliff.toml --strip header --latest > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "git-cliff rendered an empty release body for $TAG" >&2; exit 1; }
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

      - uses: goreleaser/goreleaser-action@v7
        if: steps.rp.outputs.release_created == 'true'
        with:
          version: "~> v2"
          args: release --clean --config ops/config/goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Push the Homebrew cask to the separate tap repo.
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}

  # git-cliff owns CHANGELOG.md; release-please runs with skip-changelog and never
  # writes it. This regenerates the pending entry onto the release PR's own branch
  # on every refresh. Generation is deterministic, so a re-run that finds nothing
  # to change commits nothing - and a release-please force-update of that branch is
  # simply followed, never fought.
  release-changelog:
    needs: release
    if: needs.release.outputs.release_pr != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release.outputs.release_pr).headBranchName }}
          fetch-depth: 0
      - name: Write the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(needs.release.outputs.release_pr).headBranchName }}
        run: |
          ./ops/scripts/install-git-cliff.sh
          version=$(jq -r '.["."]' .github/.release-please-manifest.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Base every run on main's CHANGELOG.md, never on whatever this branch
          # already holds. release-please force-pushes the branch on every update
          # (github.ts, `force: true`), so our commit is sometimes there and
          # sometimes not - prepending onto the branch state would double the
          # entry in exactly the runs where it survived.
          for _ in 1 2 3; do
            git checkout origin/main -- CHANGELOG.md
            git-cliff --config .github/cliff.toml --unreleased --tag "v$version" --prepend CHANGELOG.md
            # --prepend butts the new entry straight against the previous
            # heading; restore the blank line every other entry has.
            awk 'NR>1 && /^## \[/ && prev != "" {print ""} {print; prev=$0}' CHANGELOG.md > "$RUNNER_TEMP/cl" \
              && mv "$RUNNER_TEMP/cl" CHANGELOG.md
            git diff --quiet CHANGELOG.md && exit 0
            git commit -q -m "chore: regenerate the changelog" CHANGELOG.md
            git push && exit 0
            # Lost a race with a release-please force-push; rebuild on its result.
            git fetch origin "$BRANCH"
            git reset -q --hard "origin/$BRANCH"
          done
          echo "could not push the changelog after 3 attempts" >&2
          exit 1

  # Multi-arch GHCR push: linux/amd64 (Windows persona, production/remote) +
  # linux/arm64 (macOS persona, native on Apple Silicon). Both bundles come from
  # our browser release, pinned by sha in the Dockerfile. Each platform builds on
  # its own native runner and is pushed by digest; the builder then assembles the
  # tagged manifest list and attaches signed SLSA provenance.
  release-image:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read # fetch the repository content
      id-token: write # sign provenance + cache entries with GitHub OIDC
      packages: write # push to GHCR
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      file: ops/docker/Dockerfile
      meta-images: ghcr.io/glim-sh/cuttle
      meta-tags: |
        type=raw,value=${{ needs.release.outputs.version }}
        type=raw,value=${{ needs.release.outputs.major }}.${{ needs.release.outputs.minor }}
        type=raw,value=latest
        type=sha
      build-args: |
        VERSION=${{ needs.release.outputs.version }}
      cache: true
      cache-mode: max
      cache-scope: cuttle
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
